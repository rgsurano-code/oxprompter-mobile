<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teleprompter Pessoal</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#666;--card:#f4f4f4;--border:#ddd;--accent:#b00020;--mark:#d00;--green:#19a35b;--yellow:#d59b00;--red:#d22}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--fg)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 14px}button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}button.danger{color:#a00}button:focus,input:focus,textarea:focus,select:focus{outline:3px solid #7aa7ff;outline-offset:1px}.hidden{display:none!important}.app{min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}.brand{font-weight:800}.status{display:flex;align-items:center;gap:8px;font-size:13px}.dot{width:22px;height:22px;box-shadow:0 0 12px currentColor;border-radius:50%;background:#aaa;display:inline-block}.dot.green{background:var(--green)}.dot.yellow{background:var(--yellow)}.dot.red{background:var(--red)}.shell{max-width:1100px;margin:0 auto;padding:24px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:700;font-size:13px}.field input,.field textarea,.field select{padding:11px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--fg)}textarea{min-height:260px;resize:vertical;width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.section-title{font-size:18px;font-weight:800;margin:4px 0 12px}.muted{color:var(--muted);font-size:13px}.list{display:grid;gap:10px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg)}.item strong{display:block}.cmd{display:grid;grid-template-columns:1fr 180px auto;gap:8px;margin:8px 0}.cmd input,.cmd select{padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg)}.pill{padding:4px 8px;border-radius:999px;background:#ddd;font-size:12px}.prompter{background:#000;color:#fff;min-height:100vh;overflow:hidden}.prompter.light{background:#fff;color:#111}.promptTop{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;z-index:10;font-weight:700}.promptStatus{display:flex;gap:12px;align-items:center;font-size:16px}.promptStatus .dot{flex:0 0 22px}.promptTimer{font-variant-numeric:tabular-nums}.promptStage{height:100vh;overflow:hidden;padding:0 18vw;position:relative}.promptText{max-width:680px;position:absolute;left:0;right:0;top:0;margin:0 auto;text-align:center;font-size:54px;line-height:1.35;font-weight:700;white-space:pre-wrap;transition:font-size .2s}.promptText .read{opacity:.42}.promptText .current{background:rgba(255,255,0,.2);text-decoration:underline;text-decoration-thickness:6px;text-underline-offset:9px}.guide{height:12px;background:#e60000;border-radius:8px;max-width:75%;margin:18px auto 0}.prompter:not(.light) .guide{background:#ffe500}.controls{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.72);padding:5px 7px;border-radius:12px;z-index:20;width:min(94vw,980px);justify-content:center}.controls button{background:#171717;color:#fff;border-color:#444;height:32px;min-width:34px;padding:4px 8px;border-radius:8px;font-size:15px}.controls button:hover{background:#2b2b2b}.controls .iconBtn{width:36px}.controls .wideIcon{min-width:52px}.controls select{height:32px;background:#171717;color:#fff;border:1px solid #444;border-radius:8px;padding:3px 6px;font-size:14px}.runner{font-size:58px;display:none;line-height:1;z-index:20}.promptStatus .runner{position:static;margin-left:4px}.runner.show{display:inline-block;animation:bounce .55s infinite alternate}@keyframes bounce{to{transform:translateY(-6px)}}.note{background:#fff4b8;border:1px solid #e6d06a;color:#5b4d00;padding:8px;border-radius:8px;font-size:13px;margin:8px 0}.password{max-width:460px;margin:10vh auto;background:#07110f!important;border:1px solid rgba(66,255,208,.45)!important;box-shadow:0 0 35px rgba(66,255,208,.12),inset 0 0 28px rgba(66,255,208,.03)}.password-version{color:#42ffd0;font-size:13px;letter-spacing:2px;margin:-4px 0 12px;text-align:center;text-shadow:0 0 10px rgba(66,255,208,.35)}
.password h1{color:#42ffd0;text-shadow:0 0 12px rgba(66,255,208,.35)}.password input{background:#020504!important;color:#dffef7!important;border:1px solid rgba(66,255,208,.45)!important}.check{display:flex;align-items:center;gap:8px}.check input{width:18px;height:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}.cmd{grid-template-columns:1fr}.promptText{font-size:36px}.promptStage{padding:10vh 5vw}}

/* Global cyberpunk theme */
body:not(.prompter){background:#050807;color:#d9fff5}body:not(.prompter) .top{background:#050807;border-bottom-color:rgba(66,255,208,.22)}body:not(.prompter) .card{background:#081210;border-color:rgba(66,255,208,.28);box-shadow:inset 0 0 20px rgba(66,255,208,.025)}body:not(.prompter) .field input,body:not(.prompter) .field textarea,body:not(.prompter) .field select,body:not(.prompter) .cmd input,body:not(.prompter) .cmd select{background:#020504;color:#dffef7;border-color:rgba(66,255,208,.35)}body:not(.prompter) button{background:#071512;color:#42ffd0;border-color:#42ffd0}body:not(.prompter) button.primary{background:#42ffd0;color:#03100d;border-color:#42ffd0}body:not(.prompter) .item{background:#06100e;border-color:rgba(66,255,208,.2);color:#d9fff5}body:not(.prompter) .muted{color:#78a99f}body:not(.prompter) h1,body:not(.prompter) h2,body:not(.prompter) h3,body:not(.prompter) h4{color:#42ffd0}
/* Editor: aproveita toda a largura, sem moldura externa sobrando */
.editor-wrap{width:100%;max-width:none;margin:0;padding:0}.editor-wrap .card{width:100%;margin:0;border-left:0;border-right:0;border-radius:0;padding:18px 24px}.editor-wrap .card:first-child{border-top:0}.editor-wrap .card:nth-child(2){padding:0;border-bottom:0}.editor-wrap .card:nth-child(2) .section-title{padding:18px 24px 8px;margin:0}.editor-wrap textarea{display:block;width:100%;min-height:calc(100vh - 180px);height:calc(100vh - 180px);resize:none;border-left:0;border-right:0;border-radius:0;padding:20px 24px;line-height:1.55;font-size:18px}.editor-wrap .card:nth-child(2) .muted{padding:10px 24px 16px;margin:0!important}
/* Campo de texto da abertura maior e sem limitação lateral */
.cyber-card textarea#quickText{width:100%;min-height:280px;height:42vh;max-height:430px;resize:vertical;display:block;padding:18px;line-height:1.5}
/* Rolagem sem áudio: contínua, suave e começa com a primeira linha no centro */
.prompter.no-audio .promptText{will-change:transform;transition:none}

/* Cyberpunk opening panel */
.cyber-home{min-height:100vh;width:100%;background:#050807;color:#d9fff5;display:flex;align-items:center;justify-content:center;padding:28px;position:relative;overflow:hidden}
.cyber-home:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(41,255,204,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(41,255,204,.045) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
.cyber-home:after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:rgba(35,255,197,.08);filter:blur(70px);right:-120px;top:-160px}
.cyber-panel{position:relative;z-index:1;width:min(1280px,100%);border:1px solid rgba(40,255,204,.55);background:rgba(5,12,11,.92);box-shadow:0 0 0 1px rgba(40,255,204,.08),0 0 40px rgba(40,255,204,.12),inset 0 0 35px rgba(40,255,204,.035);border-radius:18px;padding:30px}
.cyber-title{font-size:clamp(38px,7vw,78px);letter-spacing:.18em;font-weight:900;text-align:center;color:#42ffd0;text-shadow:0 0 8px rgba(66,255,208,.7),0 0 28px rgba(66,255,208,.28);margin:0}
.cyber-version{text-align:center;margin-top:8px;color:#78a99f;font-size:13px;letter-spacing:.22em;font-weight:700}
.cyber-sub{text-align:center;color:#87bdb0;letter-spacing:.22em;font-size:12px;margin:8px 0 28px;text-transform:uppercase}
.cyber-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.cyber-card{border:1px solid rgba(66,255,208,.28);background:rgba(8,18,16,.86);border-radius:14px;padding:18px}
.cyber-card h2{margin:0 0 10px;color:#42ffd0;font-size:16px;letter-spacing:.08em}
.cyber-card textarea{min-height:280px;background:#020504;color:#dffef7;border:1px solid rgba(66,255,208,.35);box-shadow:inset 0 0 18px rgba(0,0,0,.35)}
.cyber-card input{background:#020504;color:#dffef7;border:1px solid rgba(66,255,208,.35)}
.cyber-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.cyber-btn{background:#071512!important;color:#42ffd0!important;border:1px solid #42ffd0!important;border-radius:10px;padding:12px 16px;box-shadow:0 0 12px rgba(66,255,208,.12)}
.cyber-btn:hover{background:#0b241f!important;box-shadow:0 0 18px rgba(66,255,208,.25)}
.cyber-primary{background:#42ffd0!important;color:#03100d!important;border-color:#42ffd0!important;font-weight:800}
.cyber-list{display:grid;gap:9px;max-height:300px;overflow:auto}
.cyber-list .item{background:#06100e;border-color:rgba(66,255,208,.2);color:#d9fff5}.cyber-list .saved-script{cursor:pointer}.cyber-list .saved-script:hover{border-color:#42ffd0;box-shadow:0 0 12px rgba(66,255,208,.12)}
.cyber-hint{font-size:12px;color:#78a99f;line-height:1.5;margin-top:8px}
.cyber-badge{display:inline-block;border:1px solid rgba(66,255,208,.35);padding:4px 8px;border-radius:999px;color:#42ffd0;font-size:11px;letter-spacing:.06em}

/* V1.19 - preparação compacta */
.prepShell{padding-top:12px;padding-bottom:12px}.prepGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.prepCard{padding:12px;margin-bottom:0}.prepCard .section-title{font-size:15px;margin:0 0 8px}.prepCard .grid{gap:8px}.prepCard .field{gap:4px}.prepCard .field input,.prepCard .field select{padding:8px}.prepHint{margin-bottom:6px}.voiceTimeCard{grid-column:1/-1}.cameraCardBody{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:12px;align-items:start}.camera-preview-wrap{margin-top:0;min-width:0}.camera-preview{width:100%;aspect-ratio:16/9;object-fit:cover;background:#020504;border:1px solid rgba(66,255,208,.35);border-radius:10px;display:block}.camera-preview-note{font-size:11px;color:#78a99f;line-height:1.35;margin-top:5px}.cameraCardBody .record-help{grid-column:1/-1;margin-top:0}.voiceTimeGrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}.timeFields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.compactBtn{padding:7px 10px;font-size:12px}.cmd{grid-template-columns:minmax(0,1fr) auto;margin:5px 0}.cmd select{display:none}.cmd button{padding:6px 8px}.prepFooter{padding:10px;margin-top:10px}.prepFooter .row{justify-content:flex-end}
/* V1.28 - autorização antecipada e largura do texto */
/* V1.19 - HUD lateral */
.promptHud{position:fixed;top:0;left:0;right:0;z-index:30;pointer-events:none}.hudBox{width:100%;padding:8px 22px;background:rgba(0,0,0,.34);backdrop-filter:blur(5px);color:#fff;font-variant-numeric:tabular-nums;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:12px;border-bottom:1px solid rgba(66,255,208,.18)}.hudAlert{height:34px;display:flex;align-items:center;justify-content:center;gap:10px;grid-column:2;grid-row:1 / span 1;align-self:start}.hudAlert .dot{width:18px;height:18px}.hudAlert .runner{font-size:34px;order:0}.hudAlert .runner.show{display:inline-block}.promptTimer{font-size:46px;line-height:1;font-weight:900;letter-spacing:.02em;grid-column:1;grid-row:1 / span 2;text-align:left}.hudStatusText{font-size:12px;line-height:1.2;min-height:13px;color:#c7fff5;margin-top:2px;grid-column:2;grid-row:2;text-align:center}.hudMic{font-size:13px;color:#b8fff0;margin-top:0;grid-column:3;grid-row:1;text-align:right}.hudMicTrack{width:100px;height:7px}.hudDb{font-size:18px;color:#9ed9cc;margin-top:0;font-weight:800;grid-column:3;grid-row:2;text-align:right}.runner{display:none}.hudAlert .runner.show{display:inline-block;animation:bounce .55s infinite alternate}
@media(max-width:800px){.cyber-grid{grid-template-columns:1fr}.cyber-panel{padding:20px}.cyber-home{padding:14px}}


.splash-screen{position:fixed;inset:0;background:#020706;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#63ffe0;z-index:100000;font-family:Arial,sans-serif}

.splash-col{position:absolute;top:-30%;color:#27ff9f;font-size:17px;line-height:1.15;white-space:pre;opacity:.8;filter:drop-shadow(0 0 6px rgba(39,255,159,.35));animation:splashFall linear infinite}
@keyframes splashFall{from{transform:translateY(-15vh)}to{transform:translateY(130vh)}}
.splash-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,92vw);text-align:center;z-index:2;padding:30px}
.splash-title{font-size:clamp(42px,7vw,82px);letter-spacing:.16em;font-weight:900;text-shadow:0 0 8px #38ffd0,0 0 28px rgba(56,255,208,.55);margin:0 0 12px;opacity:0;transform:scale(.92);animation:splashTitle 2.5s ease forwards}
@keyframes splashTitle{0%{opacity:0;letter-spacing:.45em;filter:blur(8px);transform:scale(.9)}55%{opacity:1;filter:blur(0);transform:scale(1)}100%{opacity:1;letter-spacing:.16em}}
.splash-version{font-size:15px;letter-spacing:.22em;color:#7ccfc0;margin-bottom:30px;opacity:0;animation:splashFade 1s ease 1.8s forwards}
@keyframes splashFade{to{opacity:1}}
.splash-start{appearance:none;border:1px solid #45ffd5;background:rgba(0,25,22,.78);color:#63ffe0;border-radius:10px;padding:14px 48px;font-size:20px;font-weight:800;letter-spacing:.14em;cursor:pointer;box-shadow:0 0 12px rgba(56,255,208,.25),inset 0 0 18px rgba(56,255,208,.06);transition:.2s;opacity:0;animation:splashFade .8s ease 2.1s forwards}
.splash-start:hover{transform:translateY(-2px);box-shadow:0 0 24px rgba(56,255,208,.5),inset 0 0 20px rgba(56,255,208,.12)}
.splash-dev{position:absolute;right:22px;bottom:16px;color:#5caaa0;font-size:13px;letter-spacing:.1em;z-index:3}
.splash-screen.leaving{animation:splashLeave .55s ease forwards}
@keyframes splashLeave{to{opacity:0;transform:scale(1.02)}}
.password-screen{position:fixed;inset:0;background:#020706;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#d9fff5}
.password-matrix{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.62}
.password-col{position:absolute;top:-35%;color:#27ff9f;font-size:16px;line-height:1.15;white-space:pre;filter:drop-shadow(0 0 6px rgba(39,255,159,.35));animation:passwordFlow linear infinite}
.password-col.reverse{animation-name:passwordFlowReverse}
@keyframes passwordFlow{from{transform:translateY(-10vh)}to{transform:translateY(125vh)}}
@keyframes passwordFlowReverse{from{transform:translateY(125vh)}to{transform:translateY(-10vh)}}
.password-screen .password{position:relative;z-index:2;margin:0}
.fullscreen-active .controls{bottom:18px}


.mic-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:50000;padding:20px}.mic-box{width:min(520px,95vw);background:#071512;border:1px solid #42ffd0;border-radius:16px;padding:22px;box-shadow:0 0 35px rgba(66,255,208,.22);color:#dffef7}.mic-box h3{margin:0 0 8px;color:#42ffd0}.mic-meter{height:18px;border:1px solid rgba(66,255,208,.45);border-radius:999px;overflow:hidden;background:#020504;margin:18px 0}.mic-level{height:100%;width:0;background:#42ffd0;box-shadow:0 0 14px rgba(66,255,208,.7);transition:width .08s}.mic-status{font-size:13px;color:#8dcfc0;min-height:20px}.mic-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

.record-card{border:1px solid rgba(66,255,208,.28);background:#06100e;border-radius:14px;padding:16px;margin-bottom:18px}
.record-preview{position:fixed;right:18px;top:96px;width:min(300px,32vw);aspect-ratio:16/9;background:#020202;border:2px solid #42ffd0;border-radius:12px;overflow:hidden;z-index:25;box-shadow:0 0 20px rgba(66,255,208,.22)}
.record-preview video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
.record-badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.72);color:#fff;padding:5px 8px;border-radius:999px;font-size:12px}
.record-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d22;margin-right:5px;box-shadow:0 0 8px currentColor}
.recording .record-dot{background:#f33;animation:recblink 1s infinite}
@keyframes recblink{50%{opacity:.35}}
.record-controls{position:fixed;right:18px;bottom:18px;z-index:30;display:flex;gap:8px;background:transparent;padding:8px;border-radius:12px}
.record-controls button{background:#071512;color:#42ffd0;border-color:#42ffd0}
.record-controls .stop-rec{color:#fff;background:#8d1111;border-color:#f66}
.record-help{font-size:12px;color:#78a99f;line-height:1.5;margin-top:8px}
@media(max-width:700px){.cameraCardBody{grid-template-columns:1fr}.record-preview{width:180px;right:8px;top:86px}.record-controls{left:8px;right:8px;justify-content:center;bottom:8px}.record-controls button{padding:9px 10px}.promptText{padding-right:10px;max-width:86vw}.hudBox{padding:6px 10px}.promptTimer{font-size:34px}.hudDb{font-size:15px}}

function startResumeListener(){if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window))return;const cmds=(current.settings?.resumeCmds||[]).map(c=>normalize(c.phrase)).filter(Boolean);if(!cmds.length)return;const R=window.SpeechRecognition||window.webkitSpeechRecognition;const rec=new R();commandRecognition=rec;rec.lang='pt-BR';rec.continuous=true;rec.interimResults=true;rec.onresult=e=>{let txt='';for(let i=e.resultIndex;i<e.results.length;i++)txt+=e.results[i][0].transcript+' ';const n=normalize(txt);if(cmds.some(c=>n.includes(c))){paused=false;const m=findMatch(n);if(m>=0){currentWord=Math.min(words.length-1,m);lastMatch=m;renderPrompt()}else renderPrompt();setStatus('green','Roteiro retomado')}};rec.onerror=()=>{};rec.onend=()=>{if(started&&!paused&&commandRecognition===rec){try{rec.start()}catch(e){}}};try{rec.start()}catch(e){}}
function showSplash(){
  stopAll();
  document.body.className='';
  const cols=[];
  for(let i=0;i<32;i++){
    const chars=Array.from({length:18+Math.floor(Math.random()*18)},()=>Math.random()>.5?'0':'1').join('\n');
    cols.push(`<div class="splash-col" style="left:${i*3.25}%;animation-duration:${3+Math.random()*5}s;animation-delay:${-Math.random()*6}s">${chars}</div>`);
  }
  document.body.innerHTML=`<div id="splash" class="splash-screen"><div class="splash-matrix">${cols.join('')}</div><div class="splash-center"><h1 class="splash-title">OXPROMPTER</h1><button id="splashStart" class="splash-start">INICIAR</button></div><div class="splash-dev">OXPROMPTER 1.55.2</div></div>`;
  $('#splashStart').onclick=()=>{const el=$('#splash');el.classList.add('leaving');setTimeout(()=>render(),500)};
}
